<title>Reparto Receptor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: banda de marca arriba con selector de perfil; a la izquierda el recorrido de pantallas en orden; a la derecha el dispositivo (teléfono o navegador). En móvil, todo en una columna. Identidad: azul cordillera + amarillo de señalética vial. */
:root{
  --bg:#edf1f5; --surface:#ffffff; --sunk:#e3e9ef; --ink:#10212f; --muted:#566676; --line:#cfd8e1;
  --brand:#143b5c; --brand-ink:#ffffff; --accent:#f2b705; --accent-ink:#1b1500;
  --ok:#1d7f48; --ok-bg:#dff2e6; --warn:#b4530b; --warn-bg:#fcebd9; --late:#b42318; --late-bg:#fbe3e1;
  --map:#e2e8ee; --map-block:#d2dbe3; --map-street:#ffffff; --map-river:#b8d3e8;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a131b; --surface:#122029; --sunk:#0e1a22; --ink:#e6edf3; --muted:#91a3b3; --line:#243644;
  --brand:#1d4a70; --brand-ink:#f1f6fa; --accent:#f6c430; --accent-ink:#1b1500;
  --ok:#47c07d; --ok-bg:#12301f; --warn:#f19a55; --warn-bg:#3a2412; --late:#f26b61; --late-bg:#3b1715;
  --map:#15232e; --map-block:#1c2d3a; --map-street:#284052; --map-river:#1f4560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a131b; --surface:#122029; --sunk:#0e1a22; --ink:#e6edf3; --muted:#91a3b3; --line:#243644;
  --brand:#1d4a70; --brand-ink:#f1f6fa; --accent:#f6c430; --accent-ink:#1b1500;
  --ok:#47c07d; --ok-bg:#12301f; --warn:#f19a55; --warn-bg:#3a2412; --late:#f26b61; --late-bg:#3b1715;
  --map:#15232e; --map-block:#1c2d3a; --map-street:#284052; --map-river:#1f4560; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Banda superior */
.top{background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:1180px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:22px;letter-spacing:.01em}
.logo-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.logo small{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-stretch:100%}
.roles{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.roles button{border:1.5px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);background:transparent;color:var(--brand-ink);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hazard{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,var(--brand) 12px 24px)}

/* Cuerpo */
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.side h2{font-family:var(--f-display);font-stretch:112%;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.steps button{width:100%;text-align:left;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;padding:8px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.steps button:hover{background:var(--sunk)}
.steps button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.steps .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps .t{font-weight:700;font-size:14px}
.steps .h{grid-column:2;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.legend{margin-top:18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start;min-width:0}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.note{min-width:0;max-width:44ch}
.note .clock{font-family:var(--f-mono);font-size:13px;background:var(--accent);color:var(--accent-ink);display:inline-block;padding:2px 8px;border-radius:4px;font-weight:600}
.note h3{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:26px;line-height:1.1;margin:10px 0 8px;text-wrap:balance}
.note p{margin:0 0 10px;color:var(--muted)}
.note .sys{border-left:3px solid var(--brand);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.note .sys b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.nav{display:flex;gap:8px;margin-top:14px}
.nav button{border:1.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700}

/* Teléfono */
.phone{width:min(360px,100%);height:720px;max-height:82vh;min-height:560px;border-radius:38px;background:#0b1117;padding:10px;box-shadow:0 18px 40px -18px rgba(10,20,30,.45)}
.ph-in{height:100%;border-radius:30px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.sb{display:flex;justify-content:space-between;padding:10px 22px 4px;font-family:var(--f-mono);font-size:12px;font-weight:600}
.ab{display:flex;align-items:center;gap:10px;padding:8px 18px 10px}
.ab .back{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);font-weight:700}
.ab h4{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:19px;line-height:1.15}
.ab .sub{font-size:12px;color:var(--muted)}
.bd{flex:1;overflow:auto;padding:4px 18px 16px;display:flex;flex-direction:column;gap:12px}
.act{padding:12px 18px 18px;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cta{width:100%;border:2px solid var(--accent-ink);background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-stretch:110%;font-weight:800;font-size:17px;padding:14px;border-radius:12px;cursor:pointer}
.cta.danger{background:var(--late);color:#fff;border-color:var(--late)}
.cta.dark{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ghost{width:100%;border:0;background:transparent;color:var(--muted);font-weight:700;padding:4px;cursor:pointer;font-size:14px}

/* Navegador (admin) */
.browser{width:100%;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:0 18px 40px -22px rgba(10,20,30,.4)}
.bbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.adm{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:560px}
.amenu{background:var(--brand);color:var(--brand-ink);padding:14px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.amenu .co{font-family:var(--f-display);font-stretch:110%;font-weight:800;padding:4px 8px 12px;line-height:1.2}
.amenu .co small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.75;font-stretch:100%}
.amenu span{padding:7px 8px;border-radius:6px;opacity:.85}
.amenu span.on{background:color-mix(in srgb,var(--brand-ink) 14%,transparent);opacity:1;font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.amain{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ahead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ahead h4{margin:0;font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:22px}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.btn.y{background:var(--accent);border-color:var(--accent-ink);color:var(--accent-ink)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}

/* Piezas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:30px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.late{background:var(--late-bg);color:var(--late)}.pill.y{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700}
.field .in{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:44px}
.field .opt{font-weight:400;color:var(--muted)}
.photo{border:1.5px dashed var(--muted);border-radius:10px;min-height:86px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);padding:10px;background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--muted) 10%,transparent) 9px 10px)}
.photo.done{border-style:solid;border-color:var(--ok);color:var(--ok);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stop .num{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600}
.stop.done .num{background:var(--ok)}
.stop .who{font-weight:700}
.stop .where{font-size:12.5px;color:var(--muted)}
.stop .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.msgs{display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 11px;border-radius:14px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.m small{display:block;font-family:var(--f-mono);font-size:10.5px;opacity:.7;margin-top:2px}
.m.ai{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.composer{display:flex;gap:6px}.composer .in{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--surface);color:var(--muted);font-size:14px}
.iconrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.iconrow div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:700}
.iconrow svg{display:block;margin:0 auto 3px}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.banner.late{background:var(--late-bg);color:var(--late)}.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner p{margin:2px 0 0;color:var(--ink);font-size:13.5px}
.mapbox{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--map)}
.mapbox svg{display:block;width:100%;height:auto}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.otp div{border:1.5px solid var(--line);border-radius:10px;height:50px;display:grid;place-items:center;font-family:var(--f-mono);font-size:22px;font-weight:600;background:var(--surface)}
.otp div.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.code{font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:.12em;text-align:center;border:2px dashed var(--brand);border-radius:12px;padding:14px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.call{flex:1;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:34px}
.lock{flex:1;background:linear-gradient(170deg,var(--brand),#071722);color:#f1f6fa;padding:30px 16px;display:flex;flex-direction:column;gap:12px}
.lock .time{font-family:var(--f-display);font-stretch:85%;font-weight:600;font-size:64px;text-align:center;line-height:1}
.notif{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;font-size:14px}
.notif b{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.post{border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.post .meta{font-size:12px;color:var(--muted)}
.action-card{border:1.5px solid var(--accent);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.log{font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:6px}
.log div{padding:6px 8px;background:var(--sunk);border-radius:6px}

/* Modo app: solo la pantalla, a todo el ancho y alto */
.ab .back{cursor:pointer;color:var(--ink);font-size:18px;line-height:1;padding:0}
body.app .top,body.app .side,body.app .note,body.app .hazard{display:none}
body.app .wrap{display:block;max-width:none;padding:0}
body.app .stage{display:block}
body.app .phone{width:100%;height:100vh;height:100dvh;max-height:none;min-height:0;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
body.app .ph-in{border-radius:0}
body.app .browser{border-radius:0;border:0;box-shadow:none}
body.app .bbar{display:none}
body.app .adm{min-height:100vh;min-height:100dvh}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .steps{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .steps li{flex:0 0 auto}
  .steps button{grid-template-columns:auto;width:auto;white-space:nowrap}
  .steps .h{display:none}
  .stage{grid-template-columns:minmax(0,1fr)}
  .phone{margin:0 auto}
  .cols{grid-template-columns:minmax(0,1fr)}
  .adm{grid-template-columns:minmax(0,1fr)}
  .amenu{flex-direction:row;overflow-x:auto;white-space:nowrap}
  .amenu .co{padding-bottom:4px}
}
@media (max-width:440px){
  .phone{width:100%;border-radius:24px;padding:6px;height:680px}
  .ph-in{border-radius:19px}
}
@media (prefers-reduced-motion:reduce){.moving{display:none}}
</style>

<header class="top">
  <div class="top-in">
    <div class="logo"><span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z" stroke="#1b1500" stroke-width="2.2" stroke-linejoin="round" fill="none"/><circle cx="7" cy="17.5" r="1.8" fill="#1b1500"/><circle cx="17.5" cy="17.5" r="1.8" fill="#1b1500"/></svg></span>
      <span>Reparto<br><small>Prototipo desechable · datos ficticios</small></span></div>
    <nav class="roles" aria-label="Perfil">
      <button data-role="conductor" aria-pressed="true">Conductor</button>
      <button data-role="receptor" aria-pressed="false">Receptor</button>
      <button data-role="admin" aria-pressed="false">Administrador</button>
    </nav>
  </div>
  <div class="hazard" aria-hidden="true"></div>
</header>

<main class="wrap">
  <aside class="side">
    <h2 id="sideTitle">Pantallas del conductor</h2>
    <ol class="steps" id="steps"></ol>
    <p class="legend">Caso de referencia: un martes de Matías Rojas, 4 entregas en los sectores Oriente y Sur de Santiago. El botón amarillo de cada pantalla avanza a la siguiente.</p>
  </aside>
  <section class="stage" id="stage" aria-live="polite"></section>
</main>

<script>window.REPARTO_MODO={rol:"receptor"};</script>
<script>
(function(){
"use strict";

/* ---------- Datos del caso ---------- */
var E = [
  {n:1, who:"Javiera Muñoz", where:"Los Leones 1180, Providencia", sec:"Oriente", h:"09:15", pay:"Ya pagada"},
  {n:2, who:"Pedro Álvarez", where:"Irarrázaval 3410, Ñuñoa", sec:"Oriente", h:"09:50", pay:"Cobrar $45.990"},
  {n:3, who:"Sofía Contreras", where:"Walker Martínez 2050, La Florida", sec:"Sur", h:"10:40", pay:"Ya pagada"},
  {n:4, who:"Luis Bravo", where:"Pje. Los Aromos 455, Puente Alto", sec:"Sur", h:"11:45", pay:"Cobrar $22.500"}
];

/* ---------- Ayudas de dibujo ---------- */
function ico(name){
  var p = {
    phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    chat:'<path d="M4 5h16v11H9l-5 4z"/>',
    nav:'<path d="M3 11l18-8-8 18-2-8z"/>',
    cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
    pin:'<path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'
  }[name];
  return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+p+'</svg>';
}
function pill(t,k){return '<span class="pill '+(k||"")+'">'+t+'</span>';}
function field(l,v,opt){return '<div class="field"><label>'+l+(opt?' <span class="opt">(opcional)</span>':'')+'</label><div class="in">'+v+'</div></div>';}
function photo(t,done){return '<div class="photo'+(done?' done':'')+'">'+(done?'✓ ':'')+t+'</div>';}
function seg(group,opts,on){return '<div class="seg" role="group">'+opts.map(function(o,i){return '<button data-seg="'+group+'" aria-pressed="'+(i===on)+'">'+o+'</button>';}).join("")+'</div>';}
function msg(t,me,meta,ai){return '<div class="m'+(me?' me':'')+(ai?' ai':'')+'">'+t+(meta?'<small>'+meta+'</small>':'')+'</div>';}

/* Mapa ficticio de Santiago: manzanas, río Mapocho, ruta y vehículo */
function map(o){
  o=o||{};
  var s='<div class="mapbox"><svg viewBox="0 0 360 '+(o.h||230)+'" role="img" aria-label="Mapa de ejemplo">';

/* ---------- Estado y navegación ---------- */
var role="conductor", idx=0, lock=false, app=false;
var stage=document.getElementById("stage"), steps=document.getElementById("steps");
var titles={conductor:"Pantallas del conductor",receptor:"Pantallas del receptor",admin:"Panel del administrador"};

function draw(){
  var list=S[role], sc=list[idx];
  document.getElementById("sideTitle").textContent=titles[role];
  steps.innerHTML=list.map(function(s,i){return '<li><button data-go="'+i+'" aria-current="'+(i===idx)+'"><span class="n">'+String(i+1).padStart(2,"0")+'</span><span class="t">'+s.t+'</span><span class="h">'+s.h+'</span></button></li>';}).join("");
  stage.className="stage"+(role==="admin"?" wide":"");
  var note='<div class="note"><span class="clock">'+sc.h+'</span><h3>'+sc.note+'</h3><p>'+sc.txt+'</p><div class="sys"><b>Qué hace el sistema</b>'+sc.sys+'</div>'+
    '<div class="nav"><button data-prev '+(idx===0?'disabled':'')+'>‹ Anterior</button><button data-fwd>'+(idx===list.length-1?'Volver al inicio':'Siguiente ›')+'</button></div></div>';
  stage.innerHTML = role==="admin" ? note+sc.render() : sc.render()+note;
  try{localStorage.setItem("reparto-proto",JSON.stringify({role:role,idx:idx}));}catch(e){}
  var tag=(app?"app-":(lock?"solo-":""))+role;
  if(location.hash!=="#"+tag){try{history.replaceState(null,"","#"+tag);}catch(e){}}
}
function go(i){var n=S[role].length; idx=(i+n)%n; draw(); var c=steps.querySelector('[aria-current="true"]'); if(c&&steps.scrollWidth>steps.clientWidth){steps.scrollLeft=c.parentNode.offsetLeft-steps.offsetLeft-steps.clientWidth/2+c.offsetWidth/2;}}
function setRole(r){role=r; idx=0; document.querySelectorAll(".roles button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.role===r));}); draw();}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("button"); if(!t) return;
  if(t.dataset.role){setRole(t.dataset.role);return;}
  if(t.dataset.go!==undefined){go(+t.dataset.go);return;}
  if(t.hasAttribute("data-next")||t.hasAttribute("data-fwd")||t.hasAttribute("data-alt")){go(idx+1);return;}
  if(t.hasAttribute("data-prev")){go(idx-1);return;}
  if(t.dataset.seg==="modo"&&t.textContent==="Subir archivo"){go(idx+1);return;}
  if(t.dataset.seg==="modo2"&&t.textContent==="Una por una"){go(idx-1);return;}
  if(t.dataset.seg){t.parentNode.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b===t));});}
});

var h=(location.hash||"").slice(1);
if(h.indexOf("solo-")===0&&S[h.slice(5)]){h=h.slice(5);lock=true;document.querySelector(".roles").hidden=true;}
if(S[h]){role=h;} else {try{var st=JSON.parse(localStorage.getItem("reparto-proto")||"null"); if(st&&S[st.role]){role=st.role; idx=Math.min(st.idx||0,S[role].length-1);}}catch(e){}}
document.querySelectorAll(".roles button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.role===role));});
var M=window.REPARTO_MODO||null;
if(!M&&h.indexOf("app-")===0&&S[h.slice(4)]){M={rol:h.slice(4)};}
if(M&&S[M.rol]){role=M.rol;idx=0;lock=true;if(!M.solo){app=true;document.body.classList.add("app");}document.querySelector(".roles").hidden=true;}
document.querySelectorAll(".roles button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.role===role));});
draw();
})();
</script>
